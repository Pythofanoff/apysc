[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apysc"
version = "0.6"
description = "Auto python structure creator & project manager"
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["keyboard", "colorama", "pathlib", "toml"]

license = { file = "LICENSE" }

authors = [
  { name = "Pythofanoff", email = "you@example.com" }
]

[project.urls]
Homepage = "https://github.com/Pythofanoff"
Repository = "https://github.com/Pythofanoff/AutoPySC"

[tool.setuptools]
py-modules = ["cli", "config"]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["apysc*"]

[project.scripts]
apysc = "apysc.cli:cli"